name: release-sync

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to verify (blank selects latest stable for recovery)
        type: string
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify release and maintain synchronization PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/sync-release.ts

name: publish-beta

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: dev
        type: string
      version:
        description: Prerelease version, for example 2.2.0-beta.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      baseline: ${{ steps.source.outputs.baseline }}
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Verify source against latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ inputs.version }}
        run: node ../release-tools/scripts/check-beta-source.ts .
      - name: Record source commit and version
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "baseline=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Test plugin
        run: npm run test
      - name: Lint plugin
        run: npm run lint
      - name: Build plugin
        run: npm run build
      - name: Collect prerelease artifacts
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/build/main.js release-assets/main.js
          cp styles.css release-assets/styles.css
          cp manifest.json release-assets/manifest.json
          node -e "const fs=require('node:fs'); const p='release-assets/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.env.BETA_VERSION; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-assets
          path: candidate/release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: beta-assets
          path: release-assets
      - name: Validate packaged manifest and assets
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s release-assets/main.js
          test -s release-assets/styles.css
          test -s release-assets/manifest.json
          node --input-type=module -e '
            import fs from "node:fs";
            const m = JSON.parse(fs.readFileSync("release-assets/manifest.json", "utf8"));
            const source = JSON.parse(fs.readFileSync("candidate/manifest.json", "utf8"));
            if (m.id !== "external-note-folders" || m.version !== process.env.BETA_VERSION ||
                !m.minAppVersion || m.minAppVersion !== source.minAppVersion) {
              throw new Error("Beta manifest does not match the requested version and source.");
            }
          '
      - name: Recheck latest stable immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ inputs.version }}
        run: node release-tools/scripts/check-beta-source.ts candidate
      - name: Publish new prerelease without overwriting a tag
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          SOURCE_BASELINE: ${{ needs.build.outputs.baseline }}
        run: node release-tools/scripts/publish-beta-release.ts
